name: Build

on: push

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            appstream \
            libfile-mimeinfo-perl \
            squashfs-tools \
            zsync
        shell: bash

      - name: Fetch appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p tools
          curl -L -o tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/appimagetool
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGE_NO_APPSTREAM: '1'
        run: |
          for i in 1 2 3; do
            npm run dist -- --publish=never && break
            echo "Retry $i/3 failed, waiting..."
            sleep 20
          done
        shell: bash

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sig
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
