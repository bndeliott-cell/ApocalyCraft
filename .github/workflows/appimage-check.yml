      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NPM_CONFIG_LOGLEVEL: 'error'
        run: npm run dist:linux -- --publish=never

      - name: Verify AppImage signature (if present)
        run: |
          APPIMAGE=$(ls -1 dist/*.AppImage | head -n 1)
          if [ -f "$APPIMAGE.sig" ]; then
            curl -L -o /tmp/apocalycraft-launcher-public-key.asc https://apocalycraft.fr/handle-download/apocalycraft-launcher-public-key.asc
            echo "ac7047ccdd212241ffdff3d7fe41672b3e90f9dbbd15ee70dd41e1f2eb14c49f  /tmp/apocalycraft-launcher-public-key.asc" | sha256sum -c -
            gpg --import /tmp/apocalycraft-launcher-public-key.asc
            gpg --verify "$APPIMAGE.sig" "$APPIMAGE"
          else
            echo "Skipping signature verification (missing public key or .sig)."
          fi

      - name: Lint AppDir
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPSTREAMCLI_NO_NET: '1'
        run: |
          APPIMAGE=$(ls -1 dist/*.AppImage | head -n 1)
          (cd dist && "./$(basename "$APPIMAGE")" --appimage-extract)
